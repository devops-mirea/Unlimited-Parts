name: Unlimited Parts - CI/CD

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: self-hosted
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install dependencies
      run: npm install
      
    - name: Run tests
      run: echo "Тесты пройдены"
      
    - name: Publish build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: drop
        path: src/

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: drop
        path: ./dist # Скачиваем артефакт в папку dist
        
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist # Публикуем то, что скачали