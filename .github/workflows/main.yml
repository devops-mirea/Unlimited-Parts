name: Unlimited Parts - CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # Указываем, что задача должна выполняться на НАШЕМ агенте
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install # Если нет package.json, эта строка выдаст ошибку

    - name: Run tests
      run: echo "Тесты прошли успешно!" # В реальном проекте тут было бы npm test

    - name: Publish build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: drop
        path: src/